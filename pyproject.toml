[project]
name = "task-api"
version = "0.1.0"
description = "Synthetic task API for training"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.13,<3", "fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]
mcp = ["mcp>=2.3,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_format = "%(levelname)s %(name)s %(message)s"
